name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
      - run: node src/headless.js --seed 1 --night 1 --ticks 600 --out /tmp/smoke.jsonl && tail -1 /tmp/smoke.jsonl
