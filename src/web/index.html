<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0E1430; font-family: system-ui, sans-serif; color: #F5F1E6; font-size: calc(18px * var(--ui, 1)); }
  canvas { display: block; }
  #hud > div { position: fixed; text-shadow: 0 0 6px #000; }
  #hudFlames { top: 12px; left: 16px; font-size: calc(26px * var(--ui, 1)); }
  #hudClock { top: 10px; left: 50%; transform: translateX(-50%); font-size: calc(30px * var(--ui, 1)); font-weight: 700; color: #F2C14E; }
  #hudRight { top: 12px; right: 16px; text-align: right; font-size: calc(18px * var(--ui, 1)); line-height: 1.5; }
  #hudRight b, #hudCd b { color: #F2C14E; }
  #hudBar { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
  #hudBar span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #FFE58A; opacity: .45; }
  #hudBar em { margin-left: 8px; font-style: normal; font-weight: 700; color: #FFE58A; }
  #hudBar span.on { background: #FFF6C2; opacity: 1; box-shadow: 0 0 10px #FFE58A; }
  #hudCd { bottom: 16px; right: 16px; text-align: right; font-size: calc(18px * var(--ui, 1)); line-height: 1.6; }
  #hint { position: fixed; bottom: 60px; width: 100%; text-align: center; font-size: calc(20px * var(--ui, 1)); color: #FFE9B0; text-shadow: 0 0 8px #000; }
  #arrow { position: fixed; display: none; font-size: 34px; color: #FFB347; text-shadow: 0 0 8px #000; pointer-events: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(14,20,48,.78); text-align: center; }
  #overlay .box { max-width: 640px; max-height: 92vh; overflow-y: auto; padding: 20px 32px; border-radius: 16px; background: rgba(27,35,80,.95); border: 1px solid #F2C14E; }
  #overlay h1 { margin: 0 0 8px; color: #FFB347; }
  #overlay kbd { background: #F5F1E6; color: #0E1430; border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  #overlay button { font: inherit; font-size: calc(18px * var(--ui, 1)); padding: 8px 18px; border-radius: 8px; border: 1px solid #F2C14E; background: #2F5D50; color: #F5F1E6; cursor: pointer; min-width: 180px; }
  #overlay button:hover { background: #6B4A2F; }
  #overlay input[type=text], #overlay input:not([type]) { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #F2C14E; width: 200px; }
  table.board { margin: 8px auto; border-collapse: collapse; font-size: calc(18px * var(--ui, 1)); }
  table.board td, table.board th { padding: 4px 10px; border-bottom: 1px solid rgba(242,193,78,.3); }
  .small { font-size: calc(18px * var(--ui, 1)); min-height: 1em; }
  #captions { position: fixed; top: calc(56px * var(--ui, 1)); left: 50%; transform: translateX(-50%); text-align: center; font-size: calc(20px * var(--ui, 1)); text-shadow: 0 0 6px #000; pointer-events: none; }
  #captions div { background: rgba(14,20,48,.7); padding: 2px 12px; margin: 3px; border-radius: 8px; }
  #shadeArrow { position: fixed; display: none; font-size: calc(34px * var(--ui, 1)); pointer-events: none; text-shadow: 0 0 8px #000; }
  #flash { position: fixed; inset: 0; background: #FFE9B0; opacity: 0; pointer-events: none; }
  #overlay button.dup { border-color: #FF5A5F; background: #5a2030; }
  .warn { color: #FFE9B0; }
  table.keys button { min-width: 140px; padding: 3px 12px; }
  table.keys td { padding: 2px 10px; }
  #overlay label { margin: 0 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="hud">
  <div id="hudFlames"></div><div id="hudClock"></div><div id="hudRight"></div>
  <div id="hudBar"></div><div id="hudCd"></div>
</div>
<div id="hint"></div>
<div id="arrow">➤</div>
<div id="shadeArrow">➤</div>
<div id="captions"></div>
<div id="flash"></div>
<div id="overlay"><div class="box" id="overlayBox"></div></div>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
